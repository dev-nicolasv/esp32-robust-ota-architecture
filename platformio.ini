[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@^6.7.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
board_build.partitions = partitions.csv
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -DAPP_FIRMWARE_VERSION=\"1.0.0\"
  ; Credentials and endpoints can be overridden from CI/CD secrets
  -DWIFI_SSID=\"REPLACE_WIFI_SSID\"
  -DWIFI_PASSWORD=\"REPLACE_WIFI_PASSWORD\"
  -DOTA_LOCAL_METADATA_URL=\"https://replace-local-portal/metadata.json\"
  -DOTA_AWS_METADATA_URL=\"https://replace-aws-endpoint/metadata.json\"
  -DOTA_THINGSBOARD_METADATA_URL=\"https://replace-thingsboard/api/v1/TOKEN/attributes?sharedKeys=fw_version,fw_url,fw_checksum,fw_size\"
  -DOTA_THINGSBOARD_TELEMETRY_URL=\"https://replace-thingsboard/api/v1/TOKEN/telemetry\"
lib_deps =
  bblanchon/ArduinoJson@^7.1.0
